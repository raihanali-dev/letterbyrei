<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOR JIYA</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Tangerine&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

</head>

<body>





  <div class="moon-container">
    <div class="moon"></div>
  </div>


  <div class="stars"></div>

  <body>
    <div class="main-wrapper">


      <!-- Balloons -->
      <div class="balloon-container">
        <div class="balloon red">
          <div class="shine"></div>
          <div class="knot"></div>
          <div class="string"></div>
        </div>
        <div class="balloon blue">
          <div class="shine"></div>
          <div class="knot"></div>
          <div class="string"></div>
        </div>
        <div class="balloon yellow">
          <div class="shine"></div>
          <div class="knot"></div>
          <div class="string"></div>
        </div>
        <div class="balloon green">
          <div class="shine"></div>
          <div class="knot"></div>
          <div class="string"></div>
        </div>
        <div class="balloon purple">
          <div class="shine"></div>
          <div class="knot"></div>
          <div class="string"></div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <button id="clickNowBtn">Click Here</button>
      </div>

      <!-- ENVELOPE SECTION (Hidden initially) -->
      <div class="envelope-section hidden" id="envelopeSection">
        <div class="envelope-wrapper">
          <div class="envelope" id="envelope">
            <div class="envelope-front">
              <div class="envelope-label">NAMW</div>
            </div>

            <div class="envelope-flap" id="flap"></div>
            <div class="envelope-inside"></div>
            <div class="paper" id="paper">
              <p>Dear JIYA,</p>

              <p
                style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 1.1rem; line-height: 1.7; color: #333;">
                TO BE WRITTEN LATER<br>

              </p>



              <div class="from-tag">— FROM THE ONE AND ONLY GREAT RAIHAN (🗿 Credits lo to ase lo ki padhne wala, oops sorry padhne wali bhi hase 😂)</div>




              <div class="final-message">🎊 THANK YOU FOR COMING INTO MY LIFE 🎊</div>
            </div>

          </div>
        </div>
        <button class="open-btn" id="openEnvelopeBtn">Open Envelope</button>
      </div>


      <script src="script.js" defer></script>

      <!-- Stars -->
      <div class="star" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
      <div class="star" style="top: 40%; left: 25%; animation-delay: 1s;"></div>
      <div class="star" style="top: 60%; left: 70%; animation-delay: 0.5s;"></div>
      <div class="star" style="top: 30%; left: 80%; animation-delay: 1.5s;"></div>
      <div class="star" style="top: 10%; left: 50%; animation-delay: 2s;"></div>

      <!-- Glitter -->
      <div class="glitter" style="top: 15%; left: 30%; animation-delay: 1s;"></div>
      <div class="glitter" style="top: 50%; left: 60%; animation-delay: 2s;"></div>
      <div class="glitter" style="top: 70%; left: 40%; animation-delay: 1.5s;"></div>
      <div class="glitter" style="top: 35%; left: 75%; animation-delay: 0.8s;"></div>
      <div class="glitter" style="top: 5%; left: 90%; animation-delay: 1.2s;"></div>

      <div class="stars-container">
        <div class="star" style="top: 10%; left: 15%;"></div>
        <div class="star" style="top: 25%; left: 70%;"></div>
        <div class="star" style="top: 40%; left: 40%;"></div>
        <div class="star" style="top: 55%; left: 20%;"></div>
        <div class="star" style="top: 70%; left: 80%;"></div>
      </div>


      <!-- 🌠 Shooting Stars Container -->
      <div id="shooting-stars-container"></div>

    </div>

  </body>


</html>
